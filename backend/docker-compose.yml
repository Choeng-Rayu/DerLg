# ==================================================
# DerLg.com Backend — Full Docker Development Stack
# ==================================================
# Usage:
#   docker compose up -d          Start all services
#   docker compose down -v        Stop and remove data
#   docker compose logs -f api    Follow API logs

services:
  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: derlg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: derlg_user
      POSTGRES_PASSWORD: derlg_dev_password
      POSTGRES_DB: derlg_dev
    ports:
      - '5435:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U derlg_user -d derlg_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: derlg-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - '6382:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # ── NestJS Backend API ───────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder          # use builder stage for dev hot-reload
    container_name: derlg-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://derlg_user:derlg_dev_password@postgres:5432/derlg_dev?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - '3001:3001'
    volumes:
      - ./src:/app/src          # hot-reload source
      - ./prisma:/app/prisma    # hot-reload schema
    command: npm run start:dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
