# DerLg.com Backend — Development Docker Compose
# Provides PostgreSQL + Redis for local development
#
# Usage:
#   docker compose up -d        Start services
#   docker compose down         Stop services
#   docker compose down -v      Stop + remove data volumes

services:
  postgres:
    image: postgres:16-alpine
    container_name: derlg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: derlg_user
      POSTGRES_PASSWORD: derlg_dev_password
      POSTGRES_DB: derlg_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U derlg_user -d derlg_dev']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: derlg-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
